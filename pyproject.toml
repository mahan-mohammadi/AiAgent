

[project]
name = "langgraph-agent"
version = "0.1.0"
description = "A learning project for LangGraph agents"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "langchain-core>=1.6.12",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.mirrors.ustc.edu.cn/simple"
default = true
